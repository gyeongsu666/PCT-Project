<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCT - Image to Guitar Tab</title>
<style>
  :root {
    --bg: #18191b;
    --panel: #222428;
    --panel-2: #2b2e34;
    --border: #3b3f47;
    --text: #eceff3;
    --muted: #a7adb7;
    --faint: #6e7580;
    --accent: #3f8cff;
    --accent-2: #256bd1;
    --good: #5bbf7a;
    --warn: #d4aa45;
    --bad: #ef6666;
    --note: #336fc4;
    --open: #2d713f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  button, input { font: inherit; }
  .app { height: 100%; display: grid; grid-template-rows: 50px 1fr 30px; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .brand span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .file-name {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #353941; }
  .btn.primary { background: var(--accent-2); border-color: var(--accent); color: white; }
  .btn.primary:hover { background: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #fileInput { display: none; }

  /* Main layout */
  .main { min-height: 0; display: grid; grid-template-columns: 238px 1fr; }

  /* Sidebar: 3 rows — 변환설정 | 키조정 | 기록(남은 공간) */
  .sidebar {
    min-height: 0;
    display: grid;
    grid-template-rows: auto auto 1fr;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .section { padding: 15px 16px; border-bottom: 1px solid var(--border); }
  .section h2 {
    margin: 0 0 11px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--faint);
  }
  .slider { margin: 0 0 12px; }
  .slider label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 5px; }
  .slider label strong { color: var(--text); }
  input[type=range] {
    width: 100%;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: #474c55;
    outline: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* 변환 기록 섹션 */
  .history-section {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .history-header {
    padding: 12px 16px 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--faint);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    display: flex;
    gap: 9px;
    align-items: center;
    padding: 8px 9px;
    border-radius: 7px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .history-item:hover { border-color: var(--accent); background: rgba(63,140,255,.08); }
  .history-item.active { border-color: var(--accent); background: rgba(63,140,255,.13); }
  .history-thumb {
    width: 46px;
    height: 46px;
    border-radius: 5px;
    background: #1a1c1f;
    border: 1px solid var(--border);
    object-fit: cover;
    flex-shrink: 0;
  }
  .history-thumb-ph {
    width: 46px;
    height: 46px;
    border-radius: 5px;
    background: #1a1c1f;
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--faint);
  }
  .history-info { flex: 1; min-width: 0; }
  .history-name {
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }
  .history-meta { color: var(--muted); font-size: 11px; }
  .history-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--faint);
    font-size: 12px;
    padding: 20px;
    text-align: center;
  }

  /* Content area */
  .content { min-width: 0; min-height: 0; display: grid; grid-template-rows: 42px 1fr; }
  .tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab {
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 0 18px;
    cursor: pointer;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .view { min-height: 0; overflow: auto; padding: 18px; display: none; }
  .view.active { display: block; }

  .empty, .loading {
    height: 100%;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .empty.marked { border-color: var(--accent); background: rgba(63, 140, 255, .06); }
  .empty-icon { font-size: 34px; line-height: 1; color: var(--faint); }
  .loading { display: none; border-style: solid; background: var(--panel); }
  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .score {
    display: none;
    min-width: 900px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 14px;
  }
  .system { margin-bottom: 42px; }
  .string-rows { display: grid; grid-template-rows: repeat(6, 28px); }
  .string-row { display: flex; align-items: center; }
  .string-label {
    width: 24px;
    margin-right: 8px;
    text-align: right;
    color: var(--muted);
    font-family: Consolas, monospace;
    font-weight: 700;
  }
  .track { position: relative; flex: 1; height: 28px; display: flex; align-items: center; }
  .line { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #5a606a; }
  .bar { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #737a86; z-index: 2; }
  .cell {
    position: relative;
    z-index: 1;
    width: 36px;
    height: 28px;
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fret {
    min-width: 20px;
    padding: 2px 5px;
    border-radius: 5px;
    background: var(--note);
    color: white;
    text-align: center;
    font-family: Consolas, monospace;
    font-weight: 700;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .fret.open { background: var(--open); }
  .system-index { margin-top: 5px; padding-left: 32px; color: var(--faint); font-size: 11px; }

  .preview-img {
    display: none;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
  }
  .statusbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--faint);
    font-size: 11px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status { display: flex; align-items: center; gap: 7px; }
  .status.ok { color: var(--good); }
  .status.bad { color: var(--bad); }
  .grow { margin-left: auto; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: #484d56; border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">PCT <span>Image to Guitar Tab</span></div>
    <button class="btn" id="chooseBtn">PNG 선택</button>
    <input id="fileInput" type="file" accept=".png,image/png,.jpg,.jpeg,image/jpeg,.pdf,.xml,.musicxml,.mxl">
    <div class="file-name" id="fileName">선택된 파일 없음</div>
    <button class="btn primary" id="downloadBtn" disabled>타브 PNG 저장</button>
    <button class="btn" id="consoleBtn" disabled>텍스트 타브</button>
  </header>

  <main class="main">
    <aside class="sidebar">

      <!-- 변환 설정 -->
      <section class="section">
        <h2>변환 설정</h2>
        <div class="slider">
          <label>최대 프렛 범위 <strong id="spanValue">5</strong></label>
          <input id="spanSlider" type="range" min="2" max="10" value="5">
        </div>
        <div class="slider">
          <label>하이 프렛 기준 <strong id="highValue">9</strong></label>
          <input id="highSlider" type="range" min="5" max="20" value="9">
        </div>
        <div class="slider" style="margin-bottom:4px">
          <label>손 이동 가중치 <strong id="moveValue">2.5</strong></label>
          <input id="moveSlider" type="range" min="0.5" max="6" step="0.5" value="2.5">
        </div>
        <button class="btn primary" id="reconvertBtn" disabled style="width:100%; margin-top:8px">다시 변환</button>
      </section>

      <!-- 키 조정 -->
      <section class="section">
        <h2>키 조정</h2>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px;">
          <button class="btn" id="keyDownBtn" style="flex:1" disabled>▼ &minus;1</button>
          <div style="text-align:center; min-width:44px;">
            <strong id="keyValue" style="font-size:18px;">0</strong>
            <div style="color:var(--muted); font-size:11px; margin-top:2px;">반음</div>
          </div>
          <button class="btn" id="keyUpBtn" style="flex:1" disabled>▲ +1</button>
        </div>
        <button class="btn" id="keyResetBtn" style="width:100%; margin-top:8px;" disabled>초기화</button>
      </section>

      <!-- 변환 기록 -->
      <div class="history-section">
        <div class="history-header">변환 기록</div>
        <div class="history-list" id="historyList">
          <div class="history-empty">
            <div style="font-size:22px;margin-bottom:4px">📋</div>
            <div>변환 기록 없음</div>
          </div>
        </div>
      </div>
    </aside>

    <section class="content">
      <nav class="tabs">
        <button class="tab active" data-view="scoreView">타브</button>
        <button class="tab" data-view="sourceView">원본</button>
        <button class="tab" data-view="pngView">PNG</button>
      </nav>

      <div class="view active" id="scoreView">
        <div class="empty" id="dropZone">
          <div class="empty-icon">+</div>
          <strong>PNG 악보를 선택하세요</strong>
        </div>
        <div class="loading" id="loading"><div class="spinner"></div><span>변환 중</span></div>
        <div class="score" id="scoreArea"></div>
      </div>

      <div class="view" id="sourceView">
        <div class="empty" id="sourceEmpty"><strong>원본 미리보기</strong></div>
        <img class="preview-img" id="sourcePreview" alt="원본 악보">
      </div>

      <div class="view" id="pngView">
        <div class="loading" id="pngLoading"><div class="spinner"></div><span>PNG 생성 중</span></div>
        <div class="empty" id="pngEmpty"><strong>타브 PNG 미리보기</strong></div>
        <img class="preview-img" id="tabPreview" alt="타브 PNG">
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <div class="status" id="status"><span class="dot"></span><span>대기 중</span></div>
    <span class="grow" id="statusBeats">-</span>
    <span id="statusNotes">-</span>
  </footer>
</div>

<script>
const STRING_NAMES = ['e', 'B', 'G', 'D', 'A', 'E'];
let currentFile = null;
let currentResult = null;
let tabPngUrl = null;
let transposeSteps = 0;

// 기록 상태
let historyItems = [];
let currentHistoryId = null;
let currentHistoryPngUrl = null;

const $ = id => document.getElementById(id);

/* ── 탭 PNG 초기화 ─────────────────────────────────────── */
function clearTabPngPreview() {
  if (tabPngUrl) { URL.revokeObjectURL(tabPngUrl); tabPngUrl = null; }
  $('tabPreview').removeAttribute('src');
  $('tabPreview').style.display = 'none';
  $('pngEmpty').style.display = 'flex';
}

/* ── 버튼 이벤트 ────────────────────────────────────────── */
$('chooseBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => selectFile(e.target.files[0]));
$('reconvertBtn').addEventListener('click', () => currentFile && convertFile());
$('downloadBtn').addEventListener('click', downloadPng);
$('consoleBtn').addEventListener('click', showTextTab);

/* ── 키 조정 ─────────────────────────────────────────────── */
function updateKeyDisplay() {
  const v = transposeSteps;
  $('keyValue').textContent = v > 0 ? `+${v}` : v;
  $('keyResetBtn').disabled = v === 0;
}

$('keyUpBtn').addEventListener('click', () => {
  transposeSteps++;
  updateKeyDisplay();
  if (currentResult) renderScore(currentResult);
});
$('keyDownBtn').addEventListener('click', () => {
  transposeSteps--;
  updateKeyDisplay();
  if (currentResult) renderScore(currentResult);
});
$('keyResetBtn').addEventListener('click', () => {
  transposeSteps = 0;
  updateKeyDisplay();
  if (currentResult) renderScore(currentResult);
});

/* ── 슬라이더 ────────────────────────────────────────────── */
for (const [slider, label, format] of [
  ['spanSlider', 'spanValue', v => v],
  ['highSlider', 'highValue', v => v],
  ['moveSlider', 'moveValue', v => Number(v).toFixed(1)]
]) {
  $(slider).addEventListener('input', e => $(label).textContent = format(e.target.value));
}

/* ── 탭(뷰) 전환 ─────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    $(tab.dataset.view).classList.add('active');
    if (tab.dataset.view === 'pngView' && (currentFile || currentHistoryPngUrl) && !tabPngUrl)
      loadPngPreview();
  });
});

/* ── 드래그&드롭 ─────────────────────────────────────────── */
for (const area of [$('dropZone'), $('scoreView')]) {
  area.addEventListener('dragover', e => { e.preventDefault(); $('dropZone').classList.add('marked'); });
  area.addEventListener('dragleave', () => $('dropZone').classList.remove('marked'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    $('dropZone').classList.remove('marked');
    selectFile(e.dataTransfer.files[0]);
  });
}

/* ── 파일 선택 ───────────────────────────────────────────── */
function selectFile(file) {
  if (!file) return;
  currentFile = file;
  currentResult = null;
  currentHistoryId = null;
  currentHistoryPngUrl = null;
  clearTabPngPreview();
  transposeSteps = 0;
  updateKeyDisplay();
  $('fileName').textContent = file.name;
  $('downloadBtn').disabled = true;
  $('consoleBtn').disabled = true;
  $('reconvertBtn').disabled = true;
  $('keyUpBtn').disabled = true;
  $('keyDownBtn').disabled = true;
  showSourcePreview(file);
  convertFile();
}

function showSourcePreview(file) {
  const isImage = file.type.startsWith('image/');
  $('sourcePreview').style.display = isImage ? 'block' : 'none';
  $('sourceEmpty').style.display = isImage ? 'none' : 'flex';
  if (isImage) $('sourcePreview').src = URL.createObjectURL(file);
}

/* ── FormData ────────────────────────────────────────────── */
function formData() {
  const fd = new FormData();
  fd.append('file', currentFile);
  fd.append('maxFingerSpan', $('spanSlider').value);
  fd.append('highFretThreshold', $('highSlider').value);
  fd.append('handMoveCost', $('moveSlider').value);
  fd.append('transposeSteps', transposeSteps);
  return fd;
}

/* ── 변환 ────────────────────────────────────────────────── */
async function convertFile() {
  clearTabPngPreview();
  showLoading(true);
  setStatus('변환 중', '');

  try {
    const res = await fetch('/api/convert', { method: 'POST', body: formData() });
    if (!res.ok) throw new Error(await res.text());

    currentResult = await res.json();
    renderScore(currentResult);
    updateStats(currentResult);
    $('downloadBtn').disabled = false;
    $('consoleBtn').disabled = false;
    $('reconvertBtn').disabled = false;
    $('keyUpBtn').disabled = false;
    $('keyDownBtn').disabled = false;
    setStatus('변환 완료', 'ok');
    await loadHistory();                            // 기록 갱신
    if ($('pngView').classList.contains('active')) await loadPngPreview();
  } catch (err) {
    showLoading(false);
    $('dropZone').style.display = 'flex';
    $('dropZone').querySelector('strong').textContent = err.message;
    setStatus('변환 실패', 'bad');
  }
}

/* ── 악보 렌더 ───────────────────────────────────────────── */
function renderScore(data) {
  const area = $('scoreArea');
  area.innerHTML = '';
  const perSystem = 24;
  const systems = Math.max(1, Math.ceil(data.groups.length / perSystem));

  for (let sys = 0; sys < systems; sys++) {
    const start = sys * perSystem;
    const end = Math.min(start + perSystem, data.groups.length);
    const systemGroups = data.groups.slice(start, end);
    const systemEl = document.createElement('div');
    systemEl.className = 'system';
    const rows = document.createElement('div');
    rows.className = 'string-rows';

    for (let s = 0; s < 6; s++) {
      const row = document.createElement('div');
      row.className = 'string-row';
      row.innerHTML = `<div class="string-label">${STRING_NAMES[s]}</div>`;
      const track = document.createElement('div');
      track.className = 'track';
      track.innerHTML = '<div class="line"></div><div class="bar" style="left:0"></div><div class="bar" style="right:0"></div>';

      systemGroups.forEach(group => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const pos = group.positions.find(p => p.stringIndex === s);
        if (!group.isRest && pos) {
          const fretNum = pos.fret + transposeSteps;
          if (fretNum >= 0) {
            const fret = document.createElement('div');
            fret.className = 'fret' + (fretNum === 0 ? ' open' : '');
            fret.textContent = fretNum;
            cell.appendChild(fret);
          }
        }
        track.appendChild(cell);
      });

      row.appendChild(track);
      rows.appendChild(row);
    }

    systemEl.appendChild(rows);
    const index = document.createElement('div');
    index.className = 'system-index';
    index.textContent = `${start + 1} - ${end}`;
    systemEl.appendChild(index);
    area.appendChild(systemEl);
  }

  showLoading(false);
  $('dropZone').style.display = 'none';
  area.style.display = 'block';
}

/* ── 통계 업데이트 ───────────────────────────────────────── */
function updateStats(data) {
  $('statusBeats').textContent = `${data.beatCount} 박자`;
  $('statusNotes').textContent = `${data.noteCount} 음표`;
}

/* ── PNG 미리보기 ────────────────────────────────────────── */
async function loadPngPreview() {
  // 기록에서 불러온 경우 저장된 PNG 바로 표시
  if (currentHistoryPngUrl) {
    $('pngLoading').style.display = 'none';
    $('pngEmpty').style.display = 'none';
    $('tabPreview').src = currentHistoryPngUrl;
    $('tabPreview').style.display = 'block';
    return;
  }

  $('pngLoading').style.display = 'flex';
  $('pngEmpty').style.display = 'none';
  $('tabPreview').style.display = 'none';

  try {
    const res = await fetch('/api/render-png', { method: 'POST', body: formData() });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    if (tabPngUrl) URL.revokeObjectURL(tabPngUrl);
    tabPngUrl = URL.createObjectURL(blob);
    $('tabPreview').src = tabPngUrl;
    $('tabPreview').style.display = 'block';
  } catch (err) {
    $('pngEmpty').style.display = 'flex';
    $('pngEmpty').querySelector('strong').textContent = err.message;
  } finally {
    $('pngLoading').style.display = 'none';
  }
}

/* ── PNG 저장 ────────────────────────────────────────────── */
async function downloadPng() {
  // 기록에서 불러온 경우
  if (currentHistoryPngUrl) {
    const a = document.createElement('a');
    a.href = currentHistoryPngUrl;
    a.download = (currentResult?.title || 'tab') + '-tab.png';
    a.click();
    return;
  }
  if (!tabPngUrl) await loadPngPreview();
  if (!tabPngUrl) return;
  const a = document.createElement('a');
  a.href = tabPngUrl;
  a.download = `${currentResult?.title || 'tab'}-tab.png`;
  a.click();
}

/* ── 텍스트 타브 ─────────────────────────────────────────── */
function showTextTab() {
  if (!currentResult) return;
  const lines = [];
  lines.push(`${currentResult.beatCount} beats, ${currentResult.noteCount} notes, dropped ${currentResult.droppedCount}`);
  lines.push('');

  for (let start = 0; start < currentResult.groups.length; start += 16) {
    const end = Math.min(start + 16, currentResult.groups.length);
    for (let s = 0; s < 6; s++) {
      let row = STRING_NAMES[s] + '|';
      for (let i = start; i < end; i++) {
        const group = currentResult.groups[i];
        const pos = group.positions.find(p => p.stringIndex === s);
        row += pos ? '-' + String(pos.fret + transposeSteps).padEnd(3, '-') : '----';
      }
      lines.push(row + '|');
    }
    lines.push('');
  }

  const w = window.open('', '_blank', 'width=760,height=540');
  w.document.write(`<pre style="margin:0;min-height:100%;background:#18191b;color:#eceff3;padding:20px;font:13px Consolas,monospace;white-space:pre">${lines.join('\n')}</pre>`);
}

/* ── 로딩 표시 ───────────────────────────────────────────── */
function showLoading(show) {
  $('loading').style.display = show ? 'flex' : 'none';
  $('scoreArea').style.display = show ? 'none' : $('scoreArea').style.display;
  $('dropZone').style.display = show ? 'none' : $('dropZone').style.display;
}

function setStatus(text, state) {
  const el = $('status');
  el.className = 'status' + (state ? ' ' + state : '');
  el.querySelector('span:last-child').textContent = text;
}

/* ═══════════════════════════════════════════════════════════
   변환 기록
   ═══════════════════════════════════════════════════════════ */

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    if (!res.ok) return;
    historyItems = await res.json();
    renderHistoryList();
  } catch { /* non-fatal */ }
}

function renderHistoryList() {
  const list = $('historyList');
  if (!historyItems || historyItems.length === 0) {
    list.innerHTML = `
      <div class="history-empty">
        <div style="font-size:22px;margin-bottom:4px">📋</div>
        <div>변환 기록 없음</div>
      </div>`;
    return;
  }

  list.innerHTML = '';
  historyItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item' + (currentHistoryId === item.id ? ' active' : '');
    el.dataset.id = item.id;

    const transposeLabel = item.transposeSteps !== 0
      ? ` · ${item.transposeSteps > 0 ? '+' : ''}${item.transposeSteps}반음`
      : '';

    el.innerHTML = `
      <img class="history-thumb" src="${item.pngUrl}" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="history-thumb-ph" style="display:none">🎵</div>
      <div class="history-info">
        <div class="history-name" title="${escHtml(item.fileName)}">${escHtml(item.fileName)}</div>
        <div class="history-meta">${formatTime(item.convertedAt)}${transposeLabel}</div>
      </div>`;

    el.addEventListener('click', () => loadHistoryItem(item.id));
    list.appendChild(el);
  });
}

async function loadHistoryItem(id) {
  try {
    const res = await fetch(`/api/history/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    const meta = historyItems.find(h => h.id === id);

    currentResult = data;
    currentFile = null;
    currentHistoryId = id;
    currentHistoryPngUrl = meta ? meta.pngUrl : null;
    transposeSteps = 0;

    clearTabPngPreview();
    updateKeyDisplay();
    renderScore(data);
    updateStats(data);
    renderHistoryList();   // active 상태 반영

    $('fileName').textContent = data.title || '알 수 없음';
    $('sourcePreview').style.display = 'none';
    $('sourceEmpty').style.display = 'flex';
    $('downloadBtn').disabled = false;
    $('consoleBtn').disabled = false;
    $('reconvertBtn').disabled = true;    // 파일 없으므로 비활성
    $('keyUpBtn').disabled = false;
    $('keyDownBtn').disabled = false;
    setStatus('기록에서 불러옴', 'ok');

    // 타브 뷰로 전환
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelector('[data-view="scoreView"]').classList.add('active');
    $('scoreView').classList.add('active');
  } catch { /* non-fatal */ }
}

/* ── 유틸 ───────────────────────────────────────────────── */
function formatTime(isoString) {
  const diff = Math.floor((Date.now() - new Date(isoString)) / 1000);
  if (diff < 60)    return '방금 전';
  if (diff < 3600)  return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  return `${Math.floor(diff / 86400)}일 전`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ── 초기화 ─────────────────────────────────────────────── */
loadHistory();
</script>
