<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCT - Image to Guitar Tab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<style>
  :root {
    --bg: #18191b;
    --panel: #222428;
    --panel-2: #2b2e34;
    --border: #3b3f47;
    --text: #eceff3;
    --muted: #a7adb7;
    --faint: #6e7580;
    --accent: #3f8cff;
    --accent-2: #256bd1;
    --good: #5bbf7a;
    --warn: #d4aa45;
    --bad: #ef6666;
    --note: #336fc4;
    --open: #2d713f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  button, input { font: inherit; }
  .app { height: 100%; display: grid; grid-template-rows: 50px 1fr 30px; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .brand span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .file-name {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #353941; }
  .btn.primary { background: var(--accent-2); border-color: var(--accent); color: white; }
  .btn.primary:hover { background: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #fileInput { display: none; }

  /* Main layout */
  .main { min-height: 0; display: grid; grid-template-columns: 238px 1fr; }

  /* Sidebar: 3 rows — 변환설정 | 키조정 | 기록(남은 공간) */
  .sidebar {
    min-height: 0;
    display: grid;
    grid-template-rows: auto auto 1fr;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .section { padding: 15px 16px; border-bottom: 1px solid var(--border); }
  .section h2 {
    margin: 0 0 11px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--faint);
  }
  .slider { margin: 0 0 12px; }
  .slider label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 5px; }
  .slider label strong { color: var(--text); }
  input[type=range] {
    width: 100%;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: #474c55;
    outline: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* 변환 기록 섹션 */
  .history-section {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .history-header {
    padding: 12px 16px 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--faint);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    display: flex;
    gap: 9px;
    align-items: center;
    padding: 8px 9px;
    border-radius: 7px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .history-item:hover { border-color: var(--accent); background: rgba(63,140,255,.08); }
  .history-item.active { border-color: var(--accent); background: rgba(63,140,255,.13); }
  .history-thumb {
    width: 46px;
    height: 46px;
    border-radius: 5px;
    background: #1a1c1f;
    border: 1px solid var(--border);
    object-fit: cover;
    flex-shrink: 0;
  }
  .history-thumb-ph {
    width: 46px;
    height: 46px;
    border-radius: 5px;
    background: #1a1c1f;
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--faint);
  }
  .history-info { flex: 1; min-width: 0; }
  .history-name {
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }
  .history-meta { color: var(--muted); font-size: 11px; }
  .history-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--faint);
    font-size: 12px;
    padding: 20px;
    text-align: center;
  }

  /* 기록 삭제 버튼 */
  .btn-icon {
    border: 0;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    line-height: 1;
    font-size: 13px;
  }
  .btn-icon:hover { background: rgba(239,102,102,.15); color: var(--bad); }
  .history-item-del {
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 1px;
  }

  /* Content area */
  .content { min-width: 0; min-height: 0; display: grid; grid-template-rows: 42px 1fr; }
  .tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab {
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 0 18px;
    cursor: pointer;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .view { min-height: 0; overflow: auto; padding: 18px; display: none; }
  .view.active { display: block; }

  .empty, .loading {
    height: 100%;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .empty.marked { border-color: var(--accent); background: rgba(63, 140, 255, .06); }
  .empty-icon { font-size: 34px; line-height: 1; color: var(--faint); }
  .loading { display: none; border-style: solid; background: var(--panel); }
  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .score {
    display: none;
    min-width: 900px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 14px;
    position: relative;   /* 커서 라인 기준점 */
  }

  /* 노래방 커서 라인 */
  #cursorLine {
    position: absolute;
    top: 0;
    width: 2px;
    background: rgba(255, 215, 0, 0.85);
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    border-radius: 1px;
    pointer-events: none;
    display: none;
    z-index: 20;
  }
  .system { margin-bottom: 42px; }

  /* ── 박자 행 ────────────────────────────────────────────── */
  .beat-row {
    display: flex;
    align-items: flex-end;
    padding-bottom: 2px;
  }
  .beat-track {
    flex: 1;
    display: flex;
    border-left: 1.5px solid #737a86;
    border-right: 1.5px solid #737a86;
  }
  .beat-cell {
    flex: 1;
    min-width: 28px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--muted);
    font-family: Consolas, monospace;
  }

  /* 마디선: beat-cell 과 cell 모두에 적용해 연속된 세로선처럼 보이게 */
  .beat-cell.bar-start,
  .cell.bar-start {
    border-left: 1.5px solid #737a86;
  }
  /* 패딩(빈) 슬롯: 같은 item 인덱스에 있는 beat-cell/cell 모두에 적용 → 정렬 유지 */
  .beat-cell.rest-cell,
  .cell.rest-cell {
    flex: 0.25;
    min-width: 5px;
  }

  /* ── 줄(string) 영역 ────────────────────────────────────── */
  .string-rows { display: grid; grid-template-rows: repeat(6, 28px); }
  .string-row { display: flex; align-items: center; }
  .string-label {
    width: 24px;
    margin-right: 8px;
    text-align: right;
    color: var(--muted);
    font-family: Consolas, monospace;
    font-weight: 700;
  }
  .track { position: relative; flex: 1; height: 28px; display: flex; align-items: center; }
  .line { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #5a606a; }
  .bar { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #737a86; z-index: 2; }
  .cell {
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fret {
    min-width: 20px;
    padding: 2px 5px;
    border-radius: 5px;
    background: var(--note);
    color: white;
    text-align: center;
    font-family: Consolas, monospace;
    font-weight: 700;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    cursor: default;
    user-select: none;
  }
  .fret.open { background: var(--open); }
  /* 편집 모드일 때만 hover 강조 */
  .score.edit-mode .fret { cursor: pointer; }
  .score.edit-mode .fret:hover { background: var(--accent-2); }
  .score.edit-mode .fret.open:hover { background: #255c33; }
  /* 편집 모드 테두리 */
  .score.edit-mode { outline: 2px solid var(--accent); outline-offset: 4px; }
  .fret-input {
    width: 36px;
    padding: 2px 4px;
    border-radius: 5px;
    border: 1.5px solid var(--accent);
    background: #1a2535;
    color: var(--text);
    text-align: center;
    font-family: Consolas, monospace;
    font-weight: 700;
    font-size: 13px;
    outline: none;
    box-shadow: 0 0 0 2px rgba(63,140,255,.35);
  }
  .fret-input::-webkit-outer-spin-button,
  .fret-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .fret-input[type=number] { -moz-appearance: textfield; }
  .system-index { margin-top: 5px; padding-left: 32px; color: var(--faint); font-size: 11px; }

  .preview-img {
    display: none;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
  }
  .statusbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--faint);
    font-size: 11px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status { display: flex; align-items: center; gap: 7px; }
  .status.ok { color: var(--good); }
  .status.bad { color: var(--bad); }
  .grow { margin-left: auto; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: #484d56; border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">PCT <span>Image to Guitar Tab</span></div>
    <button class="btn" id="chooseBtn">PNG 선택</button>
    <input id="fileInput" type="file" accept=".png,image/png,.jpg,.jpeg,image/jpeg,.pdf,.xml,.musicxml,.mxl">
    <div class="file-name" id="fileName">선택된 파일 없음</div>
    <button class="btn" id="playBtn" disabled>▶ 재생</button>
    <button class="btn" id="editBtn" disabled>수정</button>
    <button class="btn primary" id="downloadBtn" disabled>타브 PNG 저장</button>
    <button class="btn" id="consoleBtn" disabled>텍스트 타브</button>
  </header>

  <main class="main">
    <aside class="sidebar">

      <!-- 변환 설정 -->
      <section class="section">
        <h2>변환 설정</h2>
        <div class="slider">
          <label>최대 프렛 범위 <strong id="spanValue">5</strong></label>
          <input id="spanSlider" type="range" min="2" max="10" value="5">
        </div>
        <div class="slider">
          <label>하이 프렛 기준 <strong id="highValue">9</strong></label>
          <input id="highSlider" type="range" min="5" max="20" value="9">
        </div>
        <div class="slider" style="margin-bottom:4px">
          <label>손 이동 가중치 <strong id="moveValue">2.5</strong></label>
          <input id="moveSlider" type="range" min="0.5" max="6" step="0.5" value="2.5">
        </div>
        <button class="btn primary" id="reconvertBtn" disabled style="width:100%; margin-top:8px">다시 변환</button>
      </section>

      <!-- 키 조정 -->
      <section class="section">
        <h2>키 조정</h2>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px;">
          <button class="btn" id="keyDownBtn" style="flex:1" disabled>▼ &minus;1</button>
          <div style="text-align:center; min-width:44px;">
            <strong id="keyValue" style="font-size:18px;">0</strong>
            <div style="color:var(--muted); font-size:11px; margin-top:2px;">반음</div>
          </div>
          <button class="btn" id="keyUpBtn" style="flex:1" disabled>▲ +1</button>
        </div>
        <button class="btn" id="keyResetBtn" style="width:100%; margin-top:8px;" disabled>초기화</button>
      </section>

      <!-- 변환 기록 -->
      <div class="history-section">
        <div class="history-header" style="display:flex;align-items:center;justify-content:space-between;">
          <span>변환 기록</span>
          <button class="btn-icon" id="clearHistoryBtn" title="전체 삭제" style="font-size:11px;color:var(--faint)">전체 삭제</button>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-empty">
            <div style="font-size:22px;margin-bottom:4px">📋</div>
            <div>변환 기록 없음</div>
          </div>
        </div>
      </div>
    </aside>

    <section class="content">
      <nav class="tabs">
        <button class="tab active" data-view="scoreView">타브</button>
        <button class="tab" data-view="sourceView">원본</button>
        <button class="tab" data-view="pngView">PNG</button>
      </nav>

      <div class="view active" id="scoreView">
        <div class="empty" id="dropZone">
          <div class="empty-icon">+</div>
          <strong>PNG 악보를 선택하세요</strong>
        </div>
        <div class="loading" id="loading"><div class="spinner"></div><span>변환 중</span></div>
        <div class="score" id="scoreArea">
          <div id="cursorLine"></div>
        </div>
      </div>

      <div class="view" id="sourceView">
        <div class="empty" id="sourceEmpty"><strong>원본 미리보기</strong></div>
        <img class="preview-img" id="sourcePreview" alt="원본 악보">
      </div>

      <div class="view" id="pngView">
        <div class="loading" id="pngLoading"><div class="spinner"></div><span>PNG 생성 중</span></div>
        <div class="empty" id="pngEmpty"><strong>타브 PNG 미리보기</strong></div>
        <img class="preview-img" id="tabPreview" alt="타브 PNG">
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <div class="status" id="status"><span class="dot"></span><span>대기 중</span></div>
    <span class="grow" id="statusBeats">-</span>
    <span id="statusNotes">-</span>
  </footer>
</div>

<script>
const STRING_NAMES = ['e', 'B', 'G', 'D', 'A', 'E'];
// 각 줄의 개방현 MIDI 번호 (표준 튜닝: e4=64, B3=59, G3=55, D3=50, A2=45, E2=40)
const STRING_MIDI  = [64, 59, 55, 50, 45, 40];
let currentFile = null;
let currentResult = null;
let tabPngUrl = null;
let transposeSteps = 0;
let editMode  = false;
let didDrag   = false;   // 드래그 완료 직후 click 이벤트 무시용
let pendingDrag = null;  // 드래그 상태

// 기록 상태
let historyItems = [];
let currentHistoryId = null;
let currentHistoryPngUrl = null;

const $ = id => document.getElementById(id);

/* ── 탭 PNG 초기화 ─────────────────────────────────────── */
function clearTabPngPreview() {
  if (tabPngUrl) { URL.revokeObjectURL(tabPngUrl); tabPngUrl = null; }
  $('tabPreview').removeAttribute('src');
  $('tabPreview').style.display = 'none';
  $('pngEmpty').style.display = 'flex';
}

/* ── 버튼 이벤트 ────────────────────────────────────────── */
$('chooseBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => selectFile(e.target.files[0]));
$('reconvertBtn').addEventListener('click', () => {
  if (currentFile) convertFile();
  else if (currentHistoryId) reconvertFromHistory();
});
$('downloadBtn').addEventListener('click', downloadPng);
$('consoleBtn').addEventListener('click', showTextTab);
$('editBtn').addEventListener('click', toggleEditMode);

/* ── 키 조정 ─────────────────────────────────────────────── */
function updateKeyDisplay() {
  const v = transposeSteps;
  $('keyValue').textContent = v > 0 ? `+${v}` : v;
  $('keyResetBtn').disabled = v === 0;
}

$('keyUpBtn').addEventListener('click', () => {
  transposeSteps++;
  updateKeyDisplay();
  if (currentResult) renderScore(currentResult);
});
$('keyDownBtn').addEventListener('click', () => {
  transposeSteps--;
  updateKeyDisplay();
  if (currentResult) renderScore(currentResult);
});
$('keyResetBtn').addEventListener('click', () => {
  transposeSteps = 0;
  updateKeyDisplay();
  if (currentResult) renderScore(currentResult);
});

/* ── 슬라이더 ────────────────────────────────────────────── */
for (const [slider, label, format] of [
  ['spanSlider', 'spanValue', v => v],
  ['highSlider', 'highValue', v => v],
  ['moveSlider', 'moveValue', v => Number(v).toFixed(1)]
]) {
  $(slider).addEventListener('input', e => $(label).textContent = format(e.target.value));
}

/* ── 탭(뷰) 전환 ─────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    $(tab.dataset.view).classList.add('active');
    if (tab.dataset.view === 'pngView' && (currentFile || currentHistoryPngUrl) && !tabPngUrl)
      loadPngPreview();
  });
});

/* ── 드래그&드롭 ─────────────────────────────────────────── */
for (const area of [$('dropZone'), $('scoreView')]) {
  area.addEventListener('dragover', e => { e.preventDefault(); $('dropZone').classList.add('marked'); });
  area.addEventListener('dragleave', () => $('dropZone').classList.remove('marked'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    $('dropZone').classList.remove('marked');
    selectFile(e.dataTransfer.files[0]);
  });
}

/* ── 파일 선택 ───────────────────────────────────────────── */
function selectFile(file) {
  if (!file) return;
  currentFile = file;
  currentResult = null;
  currentHistoryId = null;
  currentHistoryPngUrl = null;
  clearTabPngPreview();
  transposeSteps = 0;
  updateKeyDisplay();
  $('fileName').textContent = file.name;
  $('downloadBtn').disabled = true;
  $('consoleBtn').disabled = true;
  $('reconvertBtn').disabled = true;
  $('playBtn').disabled = true;
  $('editBtn').disabled = true;
  $('keyUpBtn').disabled = true;
  $('keyDownBtn').disabled = true;
  showSourcePreview(file);
  convertFile();
}

function showSourcePreview(file) {
  const isImage = file.type.startsWith('image/');
  $('sourcePreview').style.display = isImage ? 'block' : 'none';
  $('sourceEmpty').style.display = isImage ? 'none' : 'flex';
  if (isImage) $('sourcePreview').src = URL.createObjectURL(file);
}

/* ── FormData ────────────────────────────────────────────── */
function formData() {
  const fd = new FormData();
  fd.append('file', currentFile);
  fd.append('maxFingerSpan', $('spanSlider').value);
  fd.append('highFretThreshold', $('highSlider').value);
  fd.append('handMoveCost', $('moveSlider').value);
  fd.append('transposeSteps', transposeSteps);
  return fd;
}

/* ── 변환 ────────────────────────────────────────────────── */
async function convertFile() {
  clearTabPngPreview();
  showLoading(true);
  setStatus('변환 중', '');

  try {
    const res = await fetch('/api/convert', { method: 'POST', body: formData() });

    $('downloadBtn').disabled = false;
    $('consoleBtn').disabled = false;
    $('reconvertBtn').disabled = false;
    $('playBtn').disabled = false;
    $('editBtn').disabled = false;
    $('keyUpBtn').disabled = false;
    $('keyDownBtn').disabled = false;

  } catch (err) {
    showLoading(false);
    $('dropZone').style.display = 'flex';
    $('dropZone').querySelector('strong').textContent = err.message;
    setStatus('변환 실패', 'bad');

}

/* ── 악보 렌더 ───────────────────────────────────────────── */

/**
 * beats 배열(새 형식)을 flat한 렌더 아이템 목록으로 변환한다.
 * 구 형식(groups 배열)도 처리할 수 있도록 legacyGroupsToFlat() 를 제공한다.
 */
function beatsToFlat(beats) {
  if (!beats || beats.length === 0) return { flat: [], measureBoundaries: [] };

  // 마디별 그룹화 (순서 유지)
  const measureMap = new Map();
  beats.forEach((beat, beatIdx) => {
    const mn = beat.measureNumber;
    if (!measureMap.has(mn)) measureMap.set(mn, { timeSigNum: 0, notes: [] });
    const m = measureMap.get(mn);
    if ((beat.timeSigNum ?? 0) > 0) m.timeSigNum = beat.timeSigNum;
    (beat.notes ?? []).forEach((note, noteIdx) => {
      m.notes.push({ note, beatNumber: beat.beatNumber, beatIdx, noteIdx, isBeatStart: noteIdx === 0 });
    });
  });

  const measures = [...measureMap.values()];

  // timeSigNum carry-forward (0이면 이전 마디 박자 유지, 기본 4)
  let eff = 4;
  measures.forEach(m => {
    if (m.timeSigNum > 0) eff = m.timeSigNum;
    else m.timeSigNum = eff;
  });

  // maxNotesPerBeat: (마디 음표 수 / timeSigNum) 의 최댓값
  const maxNotesPerBeat = Math.max(1, ...measures.map(m =>
    Math.ceil((m.notes.length || 1) / m.timeSigNum)
  ));

  const flat = [];
  const measureBoundaries = [];

  const pad = n => {
    for (let i = 0; i < n; i++)
      flat.push({ note: { isRest: true, positions: [] }, beatNumber: 0,
                  beatIdx: -1, noteIdx: -1, isBeatStart: false, isMeasureStart: false, isPad: true });
  };

  measures.forEach((m, mIdx) => {
    const slots = maxNotesPerBeat * m.timeSigNum;
    const start = flat.length;
    m.notes.forEach((item, i) => {
      flat.push({ ...item, isMeasureStart: i === 0 && mIdx > 0 });
    });
    pad(slots - m.notes.length);
    measureBoundaries.push({ start, len: slots, timeSigNum: m.timeSigNum });
  });

  return { flat, measureBoundaries };
}

/** 구 형식 data.groups → flat 변환 (기존 기록 호환용) */
function legacyGroupsToFlat(groups) {
  return groups.map((g, idx) => ({
    note:           g,          // 구 형식 group 자체를 note 역할로 사용
    beatNumber:     Math.round(g.beatPosition ?? 0) + 1,
    isBeatStart:    true,       // 구 형식은 모든 칸에 박 번호 표시 (기존 동작 유지)
    isMeasureStart: (g.isNewMeasure ?? false) && idx > 0,
  }));
}

function renderScore(data) {
  if (!data) return;
  stopPlayback();   // 악보가 다시 그려지면 재생 중단

  // 새 형식(beats) 우선, 구 형식(groups) 폴백
  let flat = [], measureBoundaries = [];
  if (data.beats) {
    const r = beatsToFlat(data.beats);
    flat = r.flat; measureBoundaries = r.measureBoundaries;
  } else {
    flat = legacyGroupsToFlat(data.groups ?? []);
    let ms = 0;
    flat.forEach((item, i) => {
      if (item.isMeasureStart && i > 0) { measureBoundaries.push({ start: ms, len: i - ms }); ms = i; }
    });
    measureBoundaries.push({ start: ms, len: flat.length - ms });
  }

  const area   = $('scoreArea');
  const cursor = $('cursorLine');   // innerHTML 초기화 전에 참조 저장
  area.innerHTML = '';
  if (cursor) area.appendChild(cursor);  // 지워진 커서 다시 붙이기

  if (flat.length === 0) {
    showLoading(false); $('dropZone').style.display = 'none'; area.style.display = 'block'; return;
  }

  const totalMeasures = measureBoundaries.length || 1;
  const systems = Math.max(1, Math.ceil(totalMeasures / 4));

  for (let sys = 0; sys < systems; sys++) {
    const firstMIdx = sys * 4;
    const lastMIdx  = Math.min(firstMIdx + 4, measureBoundaries.length) - 1;
    const start = measureBoundaries[firstMIdx]?.start ?? 0;
    const end   = lastMIdx >= 0
      ? measureBoundaries[lastMIdx].start + measureBoundaries[lastMIdx].len
      : flat.length;
    const slice = flat.slice(start, Math.min(end, flat.length));
    const systemEl = document.createElement('div');
    systemEl.className = 'system';

    /* ── 박자 행 ── */
    const beatRow = document.createElement('div');
    beatRow.className = 'beat-row';
    const beatSpacer = document.createElement('div');
    beatSpacer.style.cssText = 'width:32px;flex-shrink:0';
    beatRow.appendChild(beatSpacer);

    const beatTrack = document.createElement('div');
    beatTrack.className = 'beat-track';

    slice.forEach((item, idx) => {
      const cell = document.createElement('div');
      const isBarStart = item.isMeasureStart && idx > 0;
      cell.className = 'beat-cell' + (isBarStart ? ' bar-start' : '') + (item.isPad ? ' rest-cell' : '');
      if (item.isBeatStart) {
        cell.textContent = item.beatNumber;
        if (item.beatIdx != null) cell.dataset.beatIdx = item.beatIdx;
      }
      beatTrack.appendChild(cell);
    });

    beatRow.appendChild(beatTrack);
    systemEl.appendChild(beatRow);

    /* ── 줄 영역 ── */
    const rows = document.createElement('div');
    rows.className = 'string-rows';

    for (let s = 0; s < 6; s++) {
      const row = document.createElement('div');
      row.className = 'string-row';
      row.innerHTML = `<div class="string-label">${STRING_NAMES[s]}</div>`;
      const track = document.createElement('div');
      track.className = 'track';
      track.innerHTML = '<div class="line"></div><div class="bar" style="left:0"></div><div class="bar" style="right:0"></div>';

      slice.forEach((item, idx) => {
        const note = item.note;
        const isBarStart = item.isMeasureStart && idx > 0;
        const cell = document.createElement('div');
        cell.className = 'cell' + (isBarStart ? ' bar-start' : '') + (item.isPad ? ' rest-cell' : '');

        // 새 형식: note.positions / 구 형식: note.positions (동일 필드명)
        const pos = (note.positions ?? []).find(p => p.stringIndex === s);
        if (!note.isRest && pos) {
          const fretNum = pos.fret + transposeSteps;
          if (fretNum >= 0) {
            const fret = document.createElement('div');
            fret.className = 'fret' + (fretNum === 0 ? ' open' : '');
            fret.textContent = fretNum;
            fret.dataset.beatIdx   = item.beatIdx;
            fret.dataset.noteIdx   = item.noteIdx;
            fret.dataset.stringIdx = s;
            fret.dataset.rawFret   = pos.fret;
            fret.addEventListener('mousedown', e => initNoteDrag(e, fret));
            fret.addEventListener('click',     () => startFretEdit(fret));
            cell.appendChild(fret);
          }
        }
        track.appendChild(cell);
      });

      row.appendChild(track);
      rows.appendChild(row);
    }

    systemEl.appendChild(rows);
    const index = document.createElement('div');
    index.className = 'system-index';
    index.textContent = `마디 ${firstMIdx + 1} – ${lastMIdx + 1}`;
    systemEl.appendChild(index);
    area.appendChild(systemEl);
  }

  showLoading(false);
  $('dropZone').style.display = 'none';
  area.style.display = 'block';
}

/* ── 줄 드래그 (string 이동) ─────────────────────────────── */
const DRAG_THRESHOLD = 6; // px — 이 이상 움직여야 드래그로 판정

function initNoteDrag(e, fretEl) {
  if (!editMode || e.button !== 0) return;

  pendingDrag = {
    fretEl,
    startX:    e.clientX,
    startY:    e.clientY,
    beatIdx:   parseInt(fretEl.dataset.beatIdx),
    noteIdx:   parseInt(fretEl.dataset.noteIdx),
    stringIdx: parseInt(fretEl.dataset.stringIdx),
    rawFret:   parseInt(fretEl.dataset.rawFret),
    dragging:  false,
    ghost:     null,
    targetStringIdx: parseInt(fretEl.dataset.stringIdx),
  };

  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragUp);
}

function onDragMove(e) {
  if (!pendingDrag) return;

  const dx = e.clientX - pendingDrag.startX;
  const dy = e.clientY - pendingDrag.startY;

  // 임계값 초과 시 드래그 시작
  if (!pendingDrag.dragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
    pendingDrag.dragging = true;

    pendingDrag.midiNum    = STRING_MIDI[pendingDrag.stringIdx] + pendingDrag.rawFret;
    pendingDrag.stringRows = pendingDrag.fretEl.closest('.string-rows');

    const ghost = document.createElement('div');
    ghost.className = 'fret';
    ghost.style.cssText = 'position:fixed;pointer-events:none;opacity:0.85;z-index:9999;min-width:24px;padding:2px 5px;';
    ghost.textContent = pendingDrag.rawFret + transposeSteps;
    document.body.appendChild(ghost);
    pendingDrag.ghost = ghost;
  }

  if (!pendingDrag.dragging) return;

  // Ghost 위치
  const g = pendingDrag.ghost;
  g.style.left = (e.clientX - 18) + 'px';
  g.style.top  = (e.clientY - 14) + 'px';

  // 점유된 줄 목록 (현재 음 제외)
  const { beatIdx, noteIdx, stringIdx, midiNum, stringRows } = pendingDrag;
  const note     = currentResult.beats[beatIdx].notes[noteIdx];
  const occupied = new Set(note.positions.filter(p => p.stringIndex !== stringIdx).map(p => p.stringIndex));

  // 커서에 가장 가까운 사용 가능한 줄 찾기
  let best = -1, bestDist = Infinity;
  Array.from(stringRows.children).forEach((row, i) => {
    if (occupied.has(i)) return;
    const rect = row.getBoundingClientRect();
    const dist = Math.abs(e.clientY - (rect.top + rect.height / 2));
    if (dist < bestDist) { bestDist = dist; best = i; }
  });

  if (best === -1) return;
  const newFret = midiNum - STRING_MIDI[best];
  const valid   = newFret >= 0 && newFret <= 24;

  pendingDrag.targetStringIdx = valid ? best : pendingDrag.stringIdx;
  g.textContent    = valid ? (newFret + transposeSteps) : '×';
  g.style.background = !valid        ? 'var(--bad)'
                     : (newFret + transposeSteps === 0) ? 'var(--open)'
                     : 'var(--accent)';
}

function onDragUp() {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup',   onDragUp);

  if (!pendingDrag) return;

  if (pendingDrag.dragging) {
    pendingDrag.ghost?.remove();

    const { beatIdx, noteIdx, stringIdx, midiNum, targetStringIdx } = pendingDrag;
    pendingDrag = null;

    if (targetStringIdx !== stringIdx) {
      const newFret = midiNum - STRING_MIDI[targetStringIdx];
      if (newFret >= 0 && newFret <= 24) {
        const note = currentResult.beats[beatIdx].notes[noteIdx];
        if (!note.positions.some(p => p.stringIndex === targetStringIdx)) {
          const pos = note.positions.find(p => p.stringIndex === stringIdx);
          if (pos) { pos.stringIndex = targetStringIdx; pos.fret = newFret; }
          renderScore(currentResult);
        }
      }
    }

    // 드래그 후 click 이벤트 무시
    didDrag = true;
    setTimeout(() => { didDrag = false; }, 0);
  } else {
    pendingDrag = null;
  }
}

/* ── 음표 삭제 (편집 모드) ───────────────────────────────── */
function deleteNotePosition(beatIdx, noteIdx, stringIdx) {
  const beat = currentResult?.beats?.[beatIdx];
  const note = beat?.notes?.[noteIdx];
  if (!note || !note.positions) return;
  note.positions = note.positions.filter(p => p.stringIndex !== stringIdx);
  if (note.positions.length === 0) note.isRest = true;

  // 해당 마디의 모든 beat에 실제 음이 하나도 없으면 마디 전체 제거
  const measureNum = beat.measureNumber;
  const hasAnyNote = currentResult.beats
    .filter(b => b.measureNumber === measureNum)
    .some(b => (b.notes ?? []).some(n => !n.isRest && (n.positions ?? []).length > 0));
  if (!hasAnyNote)
    currentResult.beats = currentResult.beats.filter(b => b.measureNumber !== measureNum);

  renderScore(currentResult);
}

/* ── 프렛 인라인 편집 ────────────────────────────────────── */
function startFretEdit(fretEl) {
  if (!editMode || didDrag) return;
  if (fretEl.dataset.editing) return;
  fretEl.dataset.editing = '1';

  const beatIdx   = parseInt(fretEl.dataset.beatIdx);
  const noteIdx   = parseInt(fretEl.dataset.noteIdx);
  const stringIdx = parseInt(fretEl.dataset.stringIdx);
  const rawFret   = parseInt(fretEl.dataset.rawFret);

  const input = document.createElement('input');
  input.type      = 'number';
  input.className = 'fret-input';
  input.min       = 0;
  input.max       = 24;
  input.value     = rawFret;

  const commit = () => {
    const val = parseInt(input.value);
    if (!isNaN(val) && val >= 0 && val <= 24) {
      const note = currentResult.beats[beatIdx]?.notes[noteIdx];
      const pos  = note?.positions?.find(p => p.stringIndex === stringIdx);
      if (pos) {
        pos.fret = val;
        fretEl.dataset.rawFret = val;
        const display = val + transposeSteps;
        fretEl.textContent = display;
        fretEl.className = 'fret' + (display === 0 ? ' open' : '');
      }
    }
    delete fretEl.dataset.editing;
    input.replaceWith(fretEl);
  };

  const cancel = () => {
    delete fretEl.dataset.editing;
    input.replaceWith(fretEl);
  };

  input.addEventListener('keydown', e => {
    // 빈 칸에서 Backspace/Delete → 이 음표 삭제
    if ((e.key === 'Delete' || e.key === 'Backspace') && input.value === '') {
      e.preventDefault();
      input.removeEventListener('blur', commit);   // 재렌더 시 blur→commit 방지
      deleteNotePosition(beatIdx, noteIdx, stringIdx);
      return;
    }
    if (e.key === 'Enter')  { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', commit);

  fretEl.replaceWith(input);
  input.select();
}

/* ── 통계 업데이트 ───────────────────────────────────────── */
function updateStats(data) {

/* ── PNG 미리보기 ────────────────────────────────────────── */
async function loadPngPreview() {

  $('pngEmpty').style.display = 'none';

/* ── PNG 저장 ────────────────────────────────────────────── */
async function downloadPng() {
  // 기록에서 불러온 경우
  if (currentHistoryPngUrl) {
    const a = document.createElement('a');
    a.href = currentHistoryPngUrl;
    a.download = (currentResult?.title || 'tab') + '-tab.png';
    a.click();
    return;
  }
  if (!tabPngUrl) await loadPngPreview();
  if (!tabPngUrl) return;
  const a = document.createElement('a');
  a.href = tabPngUrl;
  a.download = `${currentResult?.title || 'tab'}-tab.png`;
  a.click();
}

/* ── 텍스트 타브 ─────────────────────────────────────────── */
function showTextTab() {
  if (!currentResult) return;
  // 새 형식(beats) 우선, 구 형식(groups) 폴백으로 flat 노트 목록 만들기
  const flat = currentResult.beats
    ? currentResult.beats.flatMap(b => b.notes ?? [])
    : (currentResult.groups ?? []);

  const lines = [];
  lines.push(`beats: ${currentResult.beatCount ?? flat.length}  notes: ${currentResult.noteCount}  dropped: ${currentResult.droppedCount}`);
  lines.push('');

  for (let start = 0; start < flat.length; start += 16) {
    const end = Math.min(start + 16, flat.length);
    for (let s = 0; s < 6; s++) {
      let row = STRING_NAMES[s] + '|';
      for (let i = start; i < end; i++) {
        const note = flat[i];
        const pos = (note.positions ?? []).find(p => p.stringIndex === s);
        row += pos ? '-' + String(pos.fret + transposeSteps).padEnd(3, '-') : '----';
      }
      lines.push(row + '|');
    }
    lines.push('');
  }

  const w = window.open('', '_blank', 'width=760,height=540');
  w.document.write(`<pre style="margin:0;min-height:100%;background:#18191b;color:#eceff3;padding:20px;font:13px Consolas,monospace;white-space:pre">${lines.join('\n')}</pre>`);
}

function renderHistoryList() {
  const list = $('historyList');
  if (!historyItems || historyItems.length === 0) {
    list.innerHTML = `
      <div class="history-empty">
        <div style="font-size:22px;margin-bottom:4px">📋</div>
        <div>변환 기록 없음</div>
      </div>`;
    return;
  }

  list.innerHTML = '';
  historyItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item' + (currentHistoryId === item.id ? ' active' : '');
    el.dataset.id = item.id;

    const transposeLabel = item.transposeSteps !== 0
      ? ` · ${item.transposeSteps > 0 ? '+' : ''}${item.transposeSteps}반음`
      : '';

    el.innerHTML = `
      <img class="history-thumb" src="${item.pngUrl}" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="history-thumb-ph" style="display:none">🎵</div>
      <div class="history-info">
        <div class="history-name" title="${escHtml(item.fileName)}">${escHtml(item.fileName)}</div>
        <div class="history-meta">${formatTime(item.convertedAt)}${transposeLabel}</div>
      </div>
      <button class="btn-icon history-item-del" data-id="${item.id}" title="삭제">✕</button>`;

    el.querySelector('.history-item-del').addEventListener('click', e => {
      e.stopPropagation();
      deleteHistoryItem(item.id);
    });
    el.addEventListener('click', () => loadHistoryItem(item.id));
    list.appendChild(el);
  });
}

async function loadHistoryItem(id) {
  try {
    const res = await fetch(`/api/history/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    const meta = historyItems.find(h => h.id === id);

    currentResult = data;
    currentFile = null;
    currentHistoryId = id;
    currentHistoryPngUrl = meta ? meta.pngUrl : null;
    transposeSteps = 0;

    clearTabPngPreview();
    updateKeyDisplay();
    renderScore(data);
    updateStats(data);
    renderHistoryList();   // active 상태 반영

    $('fileName').textContent = data.title || '알 수 없음';
    $('sourcePreview').style.display = 'none';
    $('sourceEmpty').style.display = 'flex';
    $('downloadBtn').disabled = false;
    $('consoleBtn').disabled = false;
    $('reconvertBtn').disabled = false;
    $('playBtn').disabled = false;
    $('editBtn').disabled = false;
    $('keyUpBtn').disabled = false;
    $('keyDownBtn').disabled = false;
    setStatus('기록에서 불러옴', 'ok');

    // 타브 뷰로 전환
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelector('[data-view="scoreView"]').classList.add('active');
    $('scoreView').classList.add('active');
  } catch { /* non-fatal */ }
}

/* ── 기록 삭제 ──────────────────────────────────────────── */
async function deleteHistoryItem(id) {
  try {
    const res = await fetch(`/api/history/${id}`, { method: 'DELETE' });
    if (!res.ok) return;
    historyItems = historyItems.filter(h => h.id !== id);
    // 현재 보고 있던 기록이 삭제된 경우 초기화
    if (currentHistoryId === id) {
      currentHistoryId = null;
      currentHistoryPngUrl = null;
      currentResult = null;
      $('scoreArea').style.display = 'none';
      $('dropZone').style.display = 'flex';
      $('dropZone').querySelector('strong').textContent = 'PNG 악보를 선택하세요';
      $('downloadBtn').disabled = true;
      $('consoleBtn').disabled = true;
      $('reconvertBtn').disabled = true;
      $('editBtn').disabled = true;
      $('keyUpBtn').disabled = true;
      $('keyDownBtn').disabled = true;
      exitEditMode();
      $('fileName').textContent = '선택된 파일 없음';
      setStatus('대기 중', '');
    }
    renderHistoryList();
  } catch { /* non-fatal */ }
}

async function clearAllHistory() {
  if (!historyItems.length) return;
  if (!confirm('변환 기록을 모두 삭제할까요?')) return;
  try {
    const res = await fetch('/api/history', { method: 'DELETE' });
    if (!res.ok) return;
    historyItems = [];
    currentHistoryId = null;
    currentHistoryPngUrl = null;
    renderHistoryList();
  } catch { /* non-fatal */ }
}

/* ── 유틸 ───────────────────────────────────────────────── */
function formatTime(isoString) {
  const diff = Math.floor((Date.now() - new Date(isoString)) / 1000);
  if (diff < 60)    return '방금 전';
  if (diff < 3600)  return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  return `${Math.floor(diff / 86400)}일 전`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ═══════════════════════════════════════════════════════════
   노래방 재생 커서
   ═══════════════════════════════════════════════════════════ */

let isPlaying   = false;
let playRafId   = null;
let playStartMs = 0;

$('playBtn').addEventListener('click', () => {
  if (isPlaying) stopPlayback();
  else           startPlayback();
});

function startPlayback() {
  if (!currentResult?.beats?.length) return;
  stopPlayback();

  isPlaying   = true;
  playStartMs = performance.now();
  $('playBtn').textContent = '⏹ 정지';
  const cl = $('cursorLine');
  if (cl) cl.style.display = 'block';
  playRafId = requestAnimationFrame(tickPlayback);
}

function stopPlayback() {
  isPlaying = false;
  if (playRafId) { cancelAnimationFrame(playRafId); playRafId = null; }
  $('playBtn').textContent = '▶ 재생';
  const cl2 = $('cursorLine');
  if (cl2) cl2.style.display = 'none';
}

function tickPlayback(now) {
  if (!isPlaying) return;

  const bpm          = currentResult.bpm          ?? 120;
  const beatSizeInQN = currentResult.beatSizeInQN  ?? 1.0;
  const beatDurMs    = (60000 / bpm) * beatSizeInQN;

  const elapsed    = now - playStartMs;
  const beatFloat  = elapsed / beatDurMs;
  const beatIdx    = Math.floor(beatFloat);
  const fraction   = beatFloat - beatIdx;   // 0.0 ~ 1.0 (박 안에서의 진행률)
  const totalBeats = currentResult.beats.length;

  if (beatIdx >= totalBeats) { stopPlayback(); return; }

  const scoreArea = $('scoreArea');
  const curCell  = scoreArea.querySelector(`[data-beat-idx="${beatIdx}"]`);
  const nextCell = scoreArea.querySelector(`[data-beat-idx="${beatIdx + 1}"]`);

  if (curCell) moveCursorSmooth(curCell, nextCell, fraction);

  playRafId = requestAnimationFrame(tickPlayback);
}

function moveCursorSmooth(curCell, nextCell, fraction) {
  const scoreArea = $('scoreArea');
  const scoreView = $('scoreView');
  const cursor    = $('cursorLine');
  if (!cursor) return;

  const system = curCell.closest('.system');
  if (!system) return;

  const aRect = scoreArea.getBoundingClientRect();
  const cRect = curCell.getBoundingClientRect();
  const sRect = system.getBoundingClientRect();

  let left = cRect.left - aRect.left;

  // 다음 박이 같은 시스템 안에 있으면 x를 선형 보간
  if (nextCell) {
    const nextSystem = nextCell.closest('.system');
    if (nextSystem === system) {
      const nRect = nextCell.getBoundingClientRect();
      const nextLeft = nRect.left - aRect.left;
      left = left + (nextLeft - left) * fraction;
    }
    // 다음 박이 다음 시스템이면 현재 박 위치에 머물다가 시스템 교체 시 스냅
  }

  cursor.style.left   = left + 'px';
  cursor.style.top    = (sRect.top - aRect.top) + 'px';
  cursor.style.height = sRect.height + 'px';

  // 현재 시스템이 뷰 밖이면 자동 스크롤
  const viewRect   = scoreView.getBoundingClientRect();
  const sysRelTop  = sRect.top - viewRect.top;
  if (sysRelTop < 20) {
    scoreView.scrollTop += sysRelTop - 30;
  } else if (sysRelTop + sRect.height > scoreView.clientHeight - 20) {
    scoreView.scrollTop += sysRelTop + sRect.height - scoreView.clientHeight + 30;
  }
}

/* ── 초기화 ─────────────────────────────────────────────── */
$('clearHistoryBtn').addEventListener('click', clearAllHistory);
loadHistory();
</script>
